<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice Questions | AI Interview Prep</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>


    <!-- Login Protection -->

    <script>

        const loggedIn = localStorage.getItem("loggedIn");

        if (loggedIn !== "true") {

            alert("Please login first.");

            window.location.href = "login.html";

        }

    </script>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            AI Interview Prep
        </div>

        <ul class="nav-links">

            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="practice.html">Practice</a>
            </li>

            <li>
                <a href="mock-interview.html">Mock Interview</a>
            </li>

            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

        </ul>


        <button class="login-btn" id="login-btn" type="button">
            Login
        </button>

    </nav>



    <!-- Practice Section -->

    <main class="practice-page">

        <div class="practice-header">

            <h1>Practice Interview Questions</h1>

            <p>
                Choose a category and test your knowledge.
            </p>

        </div>



        <!-- Category Selection -->

        <div class="practice-categories">

            <button
                type="button"
                class="category-btn active"
                data-category="Frontend">
                Frontend
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="JavaScript">
                JavaScript
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Programming">
                Programming
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Database">
                Database
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="HR">
                HR
            </button>

            <button
                type="button"
                class="category-btn"
                data-category="Aptitude">
                Aptitude
            </button>

        </div>



        <!-- Question Box -->

        <div class="question-container" id="practice-container">

            <div class="question-top">

                <span id="question-number">
                    Question 1 of 5
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>



            <h2 id="question">
                Loading question...
            </h2>



            <!-- Options -->

            <div id="options" class="options">

                <!-- JavaScript will create options here -->

            </div>



            <!-- Next Button -->

            <button
                id="next-btn"
                type="button"
                disabled>
                Next
            </button>



            <!-- Result Box -->

            <div
                id="result"
                class="result-box"
                style="display: none;">

                <h2>
                    Interview Complete!
                </h2>


                <div
                    class="result-score"
                    id="final-score">
                    0%
                </div>


                <p id="result-message">
                    Great job!
                </p>



                <div class="result-details">

                    <p>
                        Correct Answers:
                        <span id="correct-answers">0</span>
                    </p>

                    <p>
                        Wrong Answers:
                        <span id="wrong-answers">0</span>
                    </p>

                </div>



                <div class="result-buttons">

                    <button
                        id="restart-btn"
                        type="button">
                        Practice Again
                    </button>

                    <a href="../index.html">
                        Back to Home
                    </a>

                </div>

            </div>

        </div>

    </main>



    <!-- Practice JavaScript -->

    <script src="../script.js"></script>



    <!-- Login / Logout System -->

    <script>

        const loginBtn = document.getElementById("login-btn");

        const userLoggedIn = localStorage.getItem("loggedIn");


        if (userLoggedIn === "true") {

            loginBtn.textContent = "Logout";


            loginBtn.addEventListener("click", function () {

                localStorage.removeItem("loggedIn");

                localStorage.removeItem("currentUserId");

                localStorage.removeItem("userEmail");

                localStorage.removeItem("userName");

                window.location.href = "../index.html";

            });


        } else {

            loginBtn.addEventListener("click", function () {

                window.location.href = "login.html";

            });

        }

    </script>


</body>

</html>
