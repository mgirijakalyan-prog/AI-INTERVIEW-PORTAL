<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Interview Prep</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            AI Interview Prep
        </div>

        <div class="nav-links">

            <a href="../index.html">Home</a>

            <a href="practice.html">Practice</a>

            <a href="mock-interview.html">Mock Interview</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="about.html">About</a>

        </div>

    </nav>


    <!-- Register Section -->
    <section class="register-page">

        <div class="register-container">

            <h1>Create Account</h1>

            <p>Create your account to start your interview preparation.</p>


            <form id="register-form">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-confirm-password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-submit">
                    Create Account
                </button>


                <!-- Message -->
                <p id="register-message"></p>

            </form>


            <!-- Login Link -->
            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- Register JavaScript -->
    <script src="../register.js"></script>

</body>

</html>
